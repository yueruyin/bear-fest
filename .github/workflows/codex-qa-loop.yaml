name: Codex QA Auto Fix

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened

env:
  http_proxy: http://127.0.0.1:7897
  https_proxy: http://127.0.0.1:7897

concurrency:
  group: codex-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  qa:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - macOS

    permissions:
      contents: read

    steps:

      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Prepare PR context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p .codex-context

          {
            echo "# Pull Request"
            echo
            echo "Number: $PR_NUMBER"
            echo "Base: $BASE_BRANCH"
            echo
            echo "## Title"
            echo "$PR_TITLE"
            echo
            echo "## Body"
            echo "$PR_BODY"
          } > .codex-context/pr.md

      - name: Configure local toolchain
        shell: bash
        run: |
          set -euo pipefail

          # macOS service runners do not inherit your interactive shell PATH.
          # Add common Homebrew / local / npm / nvm locations explicitly.
          for dir in \
            /opt/homebrew/bin \
            /opt/homebrew/sbin \
            /usr/local/bin \
            "$HOME/.local/bin" \
            "$HOME/.npm-global/bin" \
            "$HOME/miniconda3/bin" \
            "$HOME/anaconda3/bin" \
            "$HOME/miniforge3/bin" \
            "$HOME/mambaforge/bin"; do
            if [ -d "$dir" ]; then
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done

          # If Node was installed with nvm, expose the newest installed Node bin dir.
          if [ -d "$HOME/.nvm/versions/node" ]; then
            node_bin=$(find "$HOME/.nvm/versions/node" -mindepth 2 -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$node_bin" ]; then
              echo "$node_bin" >> "$GITHUB_PATH"
              export PATH="$node_bin:$PATH"
            fi
          fi

          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/miniconda3/bin:$HOME/anaconda3/bin:$HOME/miniforge3/bin:$HOME/mambaforge/bin:$PATH"

          echo "Python:"
          command -v python3.11
          python3.11 --version

          echo "Node:"
          command -v node
          node --version

          echo "npm:"
          command -v npm
          npm --version

          echo "Codex:"
          command -v codex
          codex --version
          codex login status

      - name: Install backend
        shell: bash
        run: |
          python3.11 -m venv .ci-venv
          source .ci-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Install frontend
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Codex QA
        shell: bash
        run: |
          codex exec \
            --ephemeral \
            --sandbox workspace-write \
            --output-schema .github/codex/schemas/qa-result.schema.json \
            --output-last-message qa-result.json \
            < .github/codex/prompts/qa.md

      - name: Upload QA result
        uses: actions/upload-artifact@v4
        with:
          name: qa-result
          path: qa-result.json


  report:
    needs: qa
    runs-on:
      - self-hosted
      - macOS

    permissions:
      issues: write
      pull-requests: write

    outputs:
      status: ${{ steps.result.outputs.status }}
      autofix: ${{ steps.result.outputs.autofix }}

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: qa-result

      - id: result
        run: |
          echo "status=$(jq -r '.status' qa-result.json)" >> "$GITHUB_OUTPUT"
          echo "autofix=$(jq -r '.should_autofix' qa-result.json)" >> "$GITHUB_OUTPUT"

      - name: Post QA report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const result = fs.readFileSync(
              "qa-result.json",
              "utf8"
            );

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
                "## 🤖 Codex QA\n\n```json\n" +
                result +
                "\n```"
            });


  retry_guard:
    needs: report

    if: >
      needs.report.outputs.status == 'FAIL' &&
      needs.report.outputs.autofix == 'true'

    runs-on:
      - self-hosted
      - macOS

    permissions:
      contents: read

    outputs:
      retry_count: ${{ steps.count.outputs.retry_count }}

    steps:

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - id: count
        run: |
          count=$(
            git log --format='%s' |
            grep -c '^fix: codex qa autofix' || true
          )

          echo "retry_count=$count" >> "$GITHUB_OUTPUT"


  generate_fix:
    needs:
      - report
      - retry_guard

    if: >
      needs.report.outputs.status == 'FAIL' &&
      needs.report.outputs.autofix == 'true' &&
      fromJSON(needs.retry_guard.outputs.retry_count) < 3

    runs-on:
      - self-hosted
      - macOS

    permissions:
      contents: read

    outputs:
      has_patch: ${{ steps.diff.outputs.has_patch }}

    steps:

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: qa-result

      - name: Configure local toolchain
        shell: bash
        run: |
          set -euo pipefail

          for dir in \
            /opt/homebrew/bin \
            /opt/homebrew/sbin \
            /usr/local/bin \
            "$HOME/.local/bin" \
            "$HOME/.npm-global/bin" \
            "$HOME/miniconda3/bin" \
            "$HOME/anaconda3/bin" \
            "$HOME/miniforge3/bin" \
            "$HOME/mambaforge/bin"; do
            if [ -d "$dir" ]; then
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done

          if [ -d "$HOME/.nvm/versions/node" ]; then
            node_bin=$(find "$HOME/.nvm/versions/node" -mindepth 2 -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$node_bin" ]; then
              echo "$node_bin" >> "$GITHUB_PATH"
              export PATH="$node_bin:$PATH"
            fi
          fi

          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/miniconda3/bin:$HOME/anaconda3/bin:$HOME/miniforge3/bin:$HOME/mambaforge/bin:$PATH"

          command -v python3.11
          python3.11 --version
          command -v node
          node --version
          command -v npm
          npm --version
          command -v codex
          codex --version
          codex login status

      - name: Install backend
        shell: bash
        run: |
          python3.11 -m venv .ci-venv
          source .ci-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"

      - run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Codex fix QA bugs
        shell: bash
        run: |
          codex exec \
            --ephemeral \
            --sandbox workspace-write \
            < .github/codex/prompts/fix.md

      - name: Build patch
        id: diff
        run: |
          git add -N .
          git diff --binary HEAD > codex-fix.patch

          if [ -s codex-fix.patch ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch
        if: steps.diff.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-fix-patch
          path: codex-fix.patch


  apply_fix:
    needs:
      - generate_fix

    if: needs.generate_fix.outputs.has_patch == 'true'

    runs-on:
      - self-hosted
      - macOS

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.CODEX_GH_PAT }}

      - uses: actions/download-artifact@v4
        with:
          name: codex-fix-patch

      - name: Apply patch
        run: |
          git apply --index codex-fix.patch

      - name: Commit and push
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "codex-qa-bot"
          git config user.email "codex-qa-bot@users.noreply.github.com"

          git commit \
            -m "fix: codex qa autofix PR #${{ github.event.pull_request.number }}"

          git push origin HEAD:"$HEAD_BRANCH"


  needs_human:
    needs:
      - report
      - retry_guard

    if: >
      needs.report.outputs.status == 'FAIL' &&
      needs.report.outputs.autofix == 'true' &&
      fromJSON(needs.retry_guard.outputs.retry_count) >= 3

    runs-on:
      - self-hosted
      - macOS

    permissions:
      issues: write
      pull-requests: write

    steps:

      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
                "## ⚠️ needs-human\n\n" +
                "Codex 已自动修复 3 轮，QA 仍未通过。" +
                "自动循环已停止，需要人工介入。"
            });